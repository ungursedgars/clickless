<meta name="theme-color" content="#ffffff">
<script>
  // Uzliek tēmu vēl pirms lapas zīmēšanas, lai tumšajā režīmā nav balta zibšņa (kā pvnkalkulators.eu)
  (function () {
    var t = null;
    try { t = localStorage.getItem('clickless-theme'); } catch (e) {}
    t = t || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0b0b0b' : '#ffffff');
  })();
</script>
